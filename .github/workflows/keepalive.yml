# Keeps the production database from being paused.
#
# Supabase pauses a free project after a week without activity, and a paused
# project does not answer at all: the pooler refuses every connection with
# "tenant/user ... not found", so the site cannot sign anyone in or list a
# single model. This project goes a week without an upload easily -- that is
# how it went down the first time.
#
# One query every three days is activity. It needs nothing beyond the
# DATABASE_URL secret the converter already uses, and `psql` is on the runner.
#
# GitHub stops scheduled workflows in a repository with no commits for 60
# days. If that happens, Actions says so and one click turns this back on.
name: keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query the production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" --no-psqlrc --tuples-only --command 'select 1'
